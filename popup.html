<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>MPT4 Helper</title></head><body><main>
<header><div class="mark">M4</div><div><h1>MPT4 Helper</h1><p>Pembantu Pengisian Markah</p></div></header>
<label for="subject">Mata Pelajaran</label><select id="subject"><option value="">-- Pilih --</option><option value="041">041 · Bahasa Melayu</option><option value="043">043 · Bahasa Inggeris</option><option value="045">045 · Matematik</option><option value="048">048 · Sains</option></select>
<section class="samples" id="samplesSection" hidden>
<h2>Contoh Data</h2>
<p>Template Excel mengikut mata pelajaran yang dipilih.</p>
<div class="sample-actions">
<button id="downloadXlsx" class="secondary" type="button">MUAT TURUN</button>
</div>

</section>
<section class="import-section" aria-labelledby="importTitle">
<h2 id="importTitle">Import Data</h2>
<div class="import-grid">
<div class="import-column">
<label for="file">Excel (.xlsx)</label><input id="file" type="file" accept=".xlsx,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
</div>
<div class="import-column">
<label for="sheetUrl">URL Google Sheets</label><input id="sheetUrl" type="url">
</div>
</div>
</section>
<button id="activate" disabled>MULA MENGISI</button><p id="status" role="status">Pilih mata pelajaran dan fail markah.</p>

</main><script type="module" src="popup.js"></script></body></html>
